<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18231c" />
      <stop offset="60%" stop-color="#0f1712" />
      <stop offset="100%" stop-color="#090d0a" />
    </linearGradient>

    <!-- Luxury Old-Money Gold Gradient -->
    <linearGradient id="goldLuxury" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e2ba" />
      <stop offset="35%" stop-color="#c9a96e" />
      <stop offset="70%" stop-color="#9d783d" />
      <stop offset="100%" stop-color="#dfba73" />
    </linearGradient>

    <!-- Subtle Inner Gold Stroke -->
    <linearGradient id="goldInner" x1="18" y1="12" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dfba73" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c9a96e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d783d" stop-opacity="0.8" />
    </linearGradient>

    <!-- Emerald Biometric Glow -->
    <linearGradient id="emeraldStroke" x1="16" y1="24" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3c4a7" />
      <stop offset="60%" stop-color="#7a9e7e" />
      <stop offset="100%" stop-color="#4f7453" />
    </linearGradient>

    <!-- Radial Glow behind emblem -->
    <radialGradient id="centerGlow" cx="32" cy="30" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7a9e7e" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#c9a96e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d0a" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="30" r="24" fill="url(#centerGlow)" />

  <!-- Outer Protective Shield -->
  <path
    d="M32 5.5 C43 9.5 51 11.5 53.5 13 C54 27 50.5 44 32 58 C13.5 44 10 27 10.5 13 C13 11.5 21 9.5 32 5.5 Z"
    fill="url(#shieldBg)"
    stroke="url(#goldLuxury)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Inner Bevel Line -->
  <path
    d="M32 9 C41 12.5 47.5 14 49.5 15.2 C50 26.5 47 41.5 32 53.5 C17 41.5 14 26.5 14.5 15.2 C16.5 14 23 12.5 32 9 Z"
    fill="none"
    stroke="url(#goldInner)"
    stroke-width="1"
    stroke-opacity="0.7"
  />

  <!-- Stylized Forensic Signature Contour & Quill Flourish -->
  <!-- Upper Loop & Descender -->
  <path
    d="M21 34 C19 32 19 28 22 25 C25.5 21.5 31 22 34 26 C37 30 35 37 31 39 C27 41 23 39 24.5 35 C26 31 33 27 43 23"
    fill="none"
    stroke="url(#goldLuxury)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Signature Underline / Forensic Baseline Sweep -->
  <path
    d="M20 42 C27 44.5 37 43 45 37.5"
    fill="none"
    stroke="url(#goldLuxury)"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Emerald Forensic Authentication Check / Seal -->
  <path
    d="M27 34.5 L31 38.5 L43 25.5"
    fill="none"
    stroke="url(#emeraldStroke)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stylized Quill Nib Apex Dot -->
  <circle cx="43" cy="23" r="1.5" fill="#f5e2ba" />
  <circle cx="20" cy="42" r="1.2" fill="#c9a96e" />
</svg>