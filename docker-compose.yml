services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensic-signature-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - AUTHENTIC_THRESHOLD=0.70
      - INCONCLUSIVE_THRESHOLD=0.55
      - MAX_UPLOAD_SIZE_BYTES=5242880
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forensic-signature-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
